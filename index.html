<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floor Plan WebXR AR</title>
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      webxr="optionalFeatures: hit-test;" 
      ar-mode-ui="enabled: true" 
      renderer="colorManagement: true; physicallyCorrectLights: true;">

      
      <!-- Asset Preloader -->
      <a-assets>
        <a-asset-item id="myModel" src="./bbb.gltf"></a-asset-item>
      </a-assets>

      <!-- Lighting -->
      <a-ambient-light intensity="0.8"></a-ambient-light>
      <a-directional-light position="1 4 2" intensity="1"></a-directional-light>

      <!-- Camera & Cursor for Tapping -->
      <a-camera position="0 1.6 0">
        <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .raycastable"></a-entity>
      </a-camera>

      <!-- 3D Model Placement (Adjust scale 

as needed) -->
      <a-entity id="model-container" position="0 0 -2">
        <a-gltf-model 
          src="#myModel" 
          scale="0.2 0.2 0.2" 
          position="0 0 0">
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
