
<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- 1. A-Frame 3D Engine -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    
    <!-- 2. MindAR Camera Tracking Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.1/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }

    </style>
  </head>
  <body>
    <!-- 3. The AR Scene -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targetslaptop.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <!-- 4. Asset Preloader -->
      <a-assets>
        <!-- Replace './model.glb' with your Glitch Asset URL if using Glitch -->
        <a-asset-item id="myModel" src="spot.gltf"></a-asset-item>
      </a-assets>


      <!-- 5. Mobile Camera -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 6. Target 0: Displays model when phone recognizes the paper target -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          src="myModel" 
          position="0 0 0" 
          rotation="0 0 0" 
          scale="1 1 1">
        </a-gltf-model>
      </a-entity>
      
    </a-scene>
  </body>
</html>
